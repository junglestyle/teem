name: teem

services:
  postgres:
    image: postgres:16
    container_name: teem-postgres
    restart: unless-stopped
    # The apps user, like the server. The image's uid 999 is netdata on TrueNAS.
    user: "568:568"
    environment:
      POSTGRES_DB: teem
      POSTGRES_USER: teem
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - /mnt/storage/teem/postgres:/var/lib/postgresql/data
      - /mnt/storage/teem/config/postgres_password:/run/secrets/postgres_password:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U teem -d teem"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ..
      # The speech target adds FFmpeg for the speech service; one image serves both.
      target: speech
    image: teem-server
    pull_policy: never
    container_name: teem-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    user: "568:568"
    env_file: /mnt/storage/teem/config/teem.env
    entrypoint: ["/bin/sh", "-ec"]
    # Secrets stay in the environment (teem.env): container argv is visible in the host's process list.
    command:
      - >-
        set -- --artifacts /srv/teem/artifacts
        --username "$$TEEM_USER" --worker-id worker-1 --origin "$$TEEM_ORIGIN"
        --reviewer-config /srv/teem/config/reviewer.json --github-config /srv/teem/config/github.json
        --decider-config /srv/teem/config/decider.json --telegram-config /srv/teem/config/telegram.json
        --host 0.0.0.0;
        if [ -f /srv/teem/config/fidelity.json ]; then
        set -- "$$@" --fidelity-config /srv/teem/config/fidelity.json;
        fi;
        if [ -f /srv/teem/config/speech.json ]; then
        set -- "$$@" --speech-url http://speech:8766;
        fi;
        exec teem-server serve "$$@"
    # Loopback only: tailscale serve publishes it to the tailnet.
    ports:
      - "127.0.0.1:8765:8765"
    networks: [default, speech]
    volumes:
      - /mnt/storage/teem/artifacts:/srv/teem/artifacts
      - /mnt/storage/teem/config:/srv/teem/config:ro

  # Voice notes, started by install/nas.sh only when config/speech.json exists. FFmpeg and whisper
  # parse audio here, isolated by the container itself: no network beyond the server, no secrets,
  # a read-only filesystem, and no capabilities.
  speech:
    image: teem-server
    pull_policy: never
    container_name: teem-speech
    restart: unless-stopped
    # Python as PID 1 ignores SIGTERM; a tiny init forwards it so stops are prompt.
    init: true
    user: "568:568"
    command: ["speech", "--speech-config", "/srv/teem/speech.json", "--scratch", "/srv/teem/speech-scratch",
              "--host", "0.0.0.0"]
    networks: [speech]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 3g
    pids_limit: 64
    volumes:
      - /mnt/storage/teem/config/speech.json:/srv/teem/speech.json:ro
      - /mnt/storage/teem/speech:/srv/teem/speech:ro
    # Recordings stay in memory, outside artifacts and backups.
    tmpfs:
      - /srv/teem/speech-scratch:rw,nosuid,nodev,size=512m,uid=568,gid=568,mode=0700

  # One-shot, run by install/nas.sh before the server starts: create or upgrade the schema.
  migrate:
    image: teem-server
    pull_policy: never
    profiles: [tools]
    depends_on:
      postgres:
        condition: service_healthy
    user: "568:568"
    env_file: /mnt/storage/teem/config/teem.env
    command: ["migrate"]

networks:
  default: {}
  # Internal: the speech container can reach the server and nothing else.
  speech:
    internal: true
